name: Android

on:
  push:
    paths:
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0" || true

      - name: Static validation
        run: node android/scripts/validate-project.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shilv-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk