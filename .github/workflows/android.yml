name: Android

on:
  push:
    paths:
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "android SDK installed at $ANDROID_HOME"

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Static validation
        run: node android/scripts/validate-project.js

      - name: Run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release signing
        working-directory: android
        shell: bash
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            mkdir -p app
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "ANDROID_SIGNING_STOREFILE=release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_STOREPASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEYALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_KEYPASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        if: env.ANDROID_SIGNING_STOREFILE != ''
        working-directory: android
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shilv-apk
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk